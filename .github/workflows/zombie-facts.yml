name: Zombie Facts data
on:
  schedule:
    - cron: "0 9 * * 1"   # weekly, Monday
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build/build_data.py", ".github/workflows/zombie-facts.yml"]  # not make_pages.py etc: a full rebuild re-downloads the Wikipedia dump
permissions:
  contents: write
  actions: write
concurrency: zombie-facts-data
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build dataset
        run: python build/build_data.py
      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "zombie-facts-bot"
          git config user.email "actions@users.noreply.github.com"
          python build/make_pages.py  # share-card counts follow the data
          git add data.json index.html 404.html */index.html
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Zombie Facts: refresh dataset"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep $((i*5)); done
          gh workflow run pages.yml --ref main
