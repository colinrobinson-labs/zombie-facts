name: Zombie Facts data
on:
  schedule:
    - cron: "0 9 * * 1"   # weekly, Monday
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build/build_data.py", ".github/workflows/zombie-facts.yml"]  # not make_pages.py etc: a full rebuild re-downloads the Wikipedia dump
permissions:
  contents: write
  actions: write
concurrency: zombie-facts-data
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build dataset
        run: python build/build_data.py
      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build/publish.sh "Zombie Facts: refresh dataset"
