name: Zombie Facts newsroom
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["build/news*", ".github/workflows/news-watch.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python build/news_probe.py
