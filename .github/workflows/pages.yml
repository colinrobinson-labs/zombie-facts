name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Copy only the public site (no build scripts, sources, docs or repo files)
        run: |
          mkdir _site
          rsync -a --exclude-from=- ./ _site/ <<'EOF'
          .git/
          .github/
          .gitignore
          _site/
          build/
          src/
          docs/
          README.md
          __pycache__/
          *.pyc
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Tell search engines what changed (IndexNow)
        continue-on-error: true
        run: sleep 30 && python3 build/indexnow.py
